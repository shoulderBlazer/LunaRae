name: lunarae
description: A new Flutter project.
publish_to: 'none'

version: 1.1.0+34

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core
  http: ^1.6.0
  provider: ^6.1.5+1

  # UI / Platform
  cupertino_icons: ^1.0.9
  google_fonts: ^8.1.0

  # Ads
  google_mobile_ads: ^5.2.0
  app_tracking_transparency: ^2.0.7

  # WebView (kept aligned with your overrides)
  webview_flutter: 4.8.0
  webview_flutter_android: ^3.16.9
  webview_flutter_wkwebview: 3.13.0
  firebase_core: ^4.10.0
  firebase_analytics: ^12.4.2
  firebase_crashlytics: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dependency_overrides:
  webview_flutter: 4.8.0
  webview_flutter_wkwebview: 3.13.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/lunarae_icon_1024x1024.png
  color_dark: "#FFFFFF"
  image_dark: assets/images/lunarae_icon_1024x1024.png

  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image: assets/images/lunarae_icon_1024x1024.png

  ios: true
  android: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/lunarae_logo_1024x1024.png
    - assets/images/lunarae_icon_1024x1024.png